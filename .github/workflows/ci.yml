name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.repository == 'bozcomlekci/deepvis'  # the public repository; the private dev repository runs no jobs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests

  torch:
    if: github.repository == 'bozcomlekci/deepvis'  # the public repository; the private dev repository runs no jobs
    name: torch · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install (CPU torch)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" != "macOS" ]; then pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu; fi
          pip install -e ".[torch,dev,onnx,keras,widget,figures]" ipykernel jupyter_client torch_geometric tensorboard
      - name: Browsers for the page tests
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium webkit
      - name: Tests
        shell: bash
        env:
          KERAS_BACKEND: torch  # Keras 3 on PyTorch here; the jax job runs it on JAX
        run: |
          MARKS="not anim and not jax and not zoo_slow"  # the full model zoo runs weekly (zoo.yml)
          if [ "$RUNNER_OS" != "Linux" ]; then MARKS="$MARKS and not browser"; fi
          pytest -q -m "$MARKS"

  jax:
    if: github.repository == 'bozcomlekci/deepvis'  # the public repository; the private dev repository runs no jobs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu  # a matching pair
          pip install -e ".[torch,jax,dev,keras]"
      # every test that can use JAX (most aren't marked: they importorskip it, so the torch job skips them); the
      # torch-only zoo entries already ran in the torch job
      - run: pytest -q -m "not anim and not zoo_slow and not browser and (jax or keras or not zoo)"
        env:
          KERAS_BACKEND: jax

  vscode:
    if: github.repository == 'bozcomlekci/deepvis'  # the public repository; the private dev repository runs no jobs
    name: VS Code extension · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]  # the extension has per-platform paths (kill, python)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - shell: bash
        run: |
          if [ "$RUNNER_OS" != "macOS" ]; then pip install torch --index-url https://download.pytorch.org/whl/cpu; fi
          pip install -e ".[torch]"
      - working-directory: vscode
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run vendor
          export DEEPVIS_TEST_PYTHON=$(python -c "import sys; print(sys.executable)")
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a npm test; else npm test; fi

  package:
    if: github.repository == 'bozcomlekci/deepvis'  # the public repository; the private dev repository runs no jobs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Python package
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
      - name: VS Code extension
        working-directory: vscode
        run: |
          npm ci --no-audit --no-fund
          npm run package
          npx vsce ls --tree | tail -40
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*
            vscode/*.vsix
