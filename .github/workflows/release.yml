name: release

# Tag v<version> (src/deepvis/__init__.py)        → the Python package on PyPI (trusted publishing)
# Tag vscode-v<version> (vscode/package.json)     → the extension on the VS Code Marketplace and Open VSX
# Either way the packages are attached to a GitHub release. workflow_dispatch builds both and, for the Python
# package, publishes to TestPyPI: a dry run. One-time setup: RELEASING.md.
on:
  push:
    tags: ["v*", "vscode-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    if: github.repository == 'bozcomlekci/deepvis' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('src/deepvis/__init__.py').read())[1])")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME but __version__ is $v"; exit 1; }
      - run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  pypi:
    needs: python
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write  # trusted publishing: no token stored here
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ github.event_name == 'workflow_dispatch' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}

  vscode:
    if: github.repository == 'bozcomlekci/deepvis' && (startsWith(github.ref, 'refs/tags/vscode-v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Marketplace trusted publishing: no token stored here
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22  # @vscode/vsce 4 needs Node 22
      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        run: |
          v=$(node -p "require('./package.json').version")
          test "vscode-v$v" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME but package.json is $v"; exit 1; }
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy
      - run: |
          npm ci --no-audit --no-fund
          npm run vendor
          DEEPVIS_TEST_PYTHON=$(which python) xvfb-run -a npm test
          npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vscode/*.vsix
      - name: Publish to the VS Code Marketplace
        # trusted publishing (OIDC): the batuoz publisher trusts this repository's release.yml
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        run: npm run publish:vsce
      - name: Publish to Open VSX
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |  # optional: skipped until the OVSX_PAT secret exists
          if [ -z "$OVSX_PAT" ]; then echo "::notice::no OVSX_PAT secret: not published to Open VSX"; exit 0; fi
          npm run publish:ovsx

  github-release:
    needs: [python, pypi, vscode]
    if: github.repository == 'bozcomlekci/deepvis' && (always() && startsWith(github.ref, 'refs/tags/') && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
